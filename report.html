<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отчёт по доске</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Verdana, sans-serif;
      color: #172b4d;
      background: #f7f8fa;
    }

    body {
      margin: 0;
      padding: 24px;
      line-height: 1.6;
    }

    h1, h2 { line-height: 1.3; }

    button, select {
      font: inherit;
      padding: 10px 14px;
      border: 2px solid #42526e;
      border-radius: 6px;
      background: white;
      color: #172b4d;
    }

    button { cursor: pointer; }
    button:focus, select:focus { outline: 3px solid #4c9aff; }

    .controls, .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 16px 0;
    }

    .card {
      min-width: 150px;
      padding: 16px;
      border: 1px solid #c1c7d0;
      border-radius: 8px;
      background: white;
    }

    .number {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .message { margin: 16px 0; }
    .error { color: #ae2e24; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #c1c7d0;
      text-align: left;
    }
  </style>
</head>
<body>
  <main>
    <h1>Статистика работы</h1>

    <div class="controls">
      <label for="period">Период активности:</label>
      <select id="period">
        <option value="7">Последние 7 дней</option>
        <option value="30">Последние 30 дней</option>
        <option value="0">За всё время</option>
      </select>
      <button id="refresh" type="button">Обновить отчёт</button>
    </div>

    <p id="message" class="message" role="status" aria-live="polite">
      Загружаем данные доски…
    </p>

    <section id="report" hidden>
      <div class="stats">
        <div class="card">Всего карточек <span class="number" id="total">0</span></div>
        <div class="card">Завершено <span class="number" id="completed">0</span></div>
        <div class="card">Открыто <span class="number" id="open">0</span></div>
        <div class="card">Активность за период <span class="number" id="active">0</span></div>
      </div>

      <h2>Карточки по спискам</h2>
      <table>
        <thead>
          <tr><th>Список</th><th>Всего</th><th>Завершено</th><th>Открыто</th></tr>
        </thead>
        <tbody id="list-rows"></tbody>
      </table>
    </section>

    <button id="authorize" type="button" hidden>Подключить доступ к карточкам</button>
  </main>

  <script src="./report.js"></script>
</body>
</html>
